# Boeing 737-700 BBJ · leitura de CSV em unidades de engenharia
aircraft_type: Boeing 737-700 BBJ
storage: csv
validated: false
notes: Perfil para dados em unidades de engenharia (CSV exportado do software L3/FA2100 ou do fornecedor FDM). O ficheiro
  .fdr do FA2100 vem comprimido em formato proprietário e não é lido diretamente.
