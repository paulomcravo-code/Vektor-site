derived:
  Absolute Roll Angle: abs([Roll Angle])
  Absolute Vertical Speed: abs([Vertical Speed])
  Pitch Rate: rate([Pitch Angle])
  Engine Asymmetry: abs([N1 Engine 1] - [N1 Engine 2])
  Absolute Localizer Deviation: abs([Localizer Deviation])
  AIR GROUND: '[Radio Height] < 5'
